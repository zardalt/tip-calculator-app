<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <link rel="preload" as="font" type="font/ttf" href="./fonts/SpaceMono-Bold.ttf" crossorigin="anonymous">
  
  <link rel="stylesheet" href="./styles/general.css">
  <link rel="stylesheet" href="./styles/main.css">
  
  <title>Frontend Mentor | Tip calculator app</title>

  <script type="module" src="./scripts/index.js" defer></script>
</head>
<body>
  <h1>
    <img src="./images/logo.svg" alt="Splitter Tax Calculator App" decoding="sync" fetchpriority="high" height="54" width="87">
  </h1>

  <main>
    <form novalidate>
      <div class="variables">
        <label for="billAmount" class="bill-amount">
          Bill
          <span class="error" aria-live="polite"></span>
        </label>
        <input type="text" 
               name="billAmount" 
               id="billAmount" 
               inputmode="numeric" 
               autocomplete="off" 
               class="bill-input" 
               placeholder="0" 
               data-allow-decimal="1" 
               data-range-start="1"
               data-range-end="1000000"
        >

        <fieldset>
          <legend>Select Tip %</legend>

          <ul>
            <li>
              <label for="fivePercent">5%</label>
              <input type="radio" name="tipPercentage" id="fivePercent" value="5">
            </li>
            <li>
              <label for="tenPercent">10%</label>
              <input type="radio" name="tipPercentage" id="tenPercent" value="10">
            </li>
            <li>
              <label for="fifteenPercent">15%</label>
              <input type="radio" name="tipPercentage" id="fifteenPercent" value="15">
            </li>
            <li>
              <label for="twentyFivePercent">25%</label>
              <input type="radio" name="tipPercentage" id="twentyFivePercent" value="25">
            </li>
            <li>
              <label for="fiftyPercent">50%</label>
              <input type="radio" name="tipPercentage" id="fiftyPercent" value="50">
            </li>
            <li class="custom">
              <input type="text" 
                     name="customPercentage" 
                     id="customPercentage" 
                     placeholder="Custom"
                     inputmode="numeric" 
                     autocomplete="off"
                     data-range-start="1"
                     data-range-end="100"
              >
            </li>
          </ul>
        </fieldset>

        <label for="noOfPeople" class="no-of-people">
          Number of People
          <span class="error" aria-live="polite"></span>
        </label>
        <input type="text" 
               inputmode="numeric" 
               placeholder="0" 
               name="noOfPeople" 
               id="noOfPeople" 
               autocomplete="off"
               data-range-start="1"
               data-range-end="Infinity"
        >
      </div>
      <div class="result">
        <div>
          <div aria-live="polite" aria-atomic="true">
            <div>Tip Amount <span>/ person</span></div>
            <p>$<span class="amount js-tip-amount">0.00</span></p>
          </div>
          <div aria-live="polite" aria-atomic="true">
            <div>Total <span>/ person</span></div>
            <p>$<span class="amount js-total">0.00</span></p>
          </div>
        </div>
        
        <button type="reset" disabled>RESET</button>
      </div>
    </form>
  </main>
</body>
</html>
